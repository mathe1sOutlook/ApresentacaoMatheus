# Checkout InfinitePay precisa receber webhooks externos sem JWT Supabase.
# A Edge Function valida cada aviso contra a API payment_check do provedor.
[functions.infinitepay-checkout]
verify_jwt = false

# Notificações do painel: chamada pelo banco (pg_net, com segredo próprio) e
# pelo navegador; a função autentica cada caso por conta própria.
[functions.push-notify]
verify_jwt = false

# Área do cliente: etapa do e-mail (anônima, com limite por IP) e convite
# (membro da equipe). A função autentica cada caso por conta própria.
[functions.portal-auth]
verify_jwt = false
